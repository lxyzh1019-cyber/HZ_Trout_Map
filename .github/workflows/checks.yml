name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Data and script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # the feature check compares with the base branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the report readers
        run: pip install --quiet pdfplumber openpyxl

      - name: Run the regression suite
        working-directory: scripts
        run: python -m unittest discover -p "test_*.py" -v

      - name: Fail if the published data is stale
        run: |
          # Rebuilding from the raw reports must reproduce exactly what is
          # committed. If it does not, someone edited data/ by hand or changed
          # the pipeline without regenerating.
          cp -r data /tmp/data-before
          (cd scripts && python3 build_history.py > /tmp/build.log)
          if ! diff -r -q /tmp/data-before data; then
            echo "::error::data/ does not match what the scripts produce."
            echo "Run: cd scripts && python3 build_history.py"
            diff -r /tmp/data-before data | head -40
            exit 1
          fi
          echo "data/ is current."
          tail -20 /tmp/build.log

      # The feature map in FEATURES.md: a changed file's feature needs a test and a
      # row in the pull request's impact table (hz-claude-config, v3.3.7).
      - name: Feature check
        if: github.event_name == 'pull_request'
        run: |
          curl -fsSL https://raw.githubusercontent.com/lxyzh1019-cyber/hz-claude-config/main/central/checks/feature_check.py -o "$RUNNER_TEMP/feature_check.py"
          python3 "$RUNNER_TEMP/feature_check.py" --base "origin/${{ github.base_ref }}"
