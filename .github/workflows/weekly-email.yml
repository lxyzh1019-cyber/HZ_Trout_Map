name: Weekly email

# Build 5 Stage 4: once a week, an email to the owner when a saved lake has a
# Prime day in the next 7 days or was stocked in the last 7. The saved lakes come
# from the repository variable SAVED_LAKES, never from a file in this public
# repository. The log shows counts only.
on:
  schedule:
    - cron: "37 14 * * 4"      # Thursdays, 7:37 AM MST (8:37 AM MDT)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the email but do not send it"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Score the saved lakes and send the email
        env:
          SAVED_LAKES: ${{ vars.SAVED_LAKES }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # A scheduled run sends; a run by hand sends only with dry run off.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node scripts/weekly_email.js
